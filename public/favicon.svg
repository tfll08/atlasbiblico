<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background with rounded corners for tab clarity -->
  <rect width="64" height="64" rx="16" fill="#173B4D"/>
  
  <!-- Outer Astronomical / Atlas Rings -->
  <circle cx="32" cy="32" r="28" stroke="#C59B3F" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.65"/>
  <circle cx="32" cy="32" r="24.5" stroke="#C59B3F" stroke-width="1.5"/>

  <!-- Subtle Ancient Compass Rose Coordinate Ticks -->
  <line x1="32" y1="5" x2="32" y2="9" stroke="#E2C17C" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="55" x2="32" y2="59" stroke="#C59B3F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="9" y2="32" stroke="#C59B3F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="32" x2="59" y2="32" stroke="#C59B3F" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Compass Star (Biblical Atlas Navigator) -->
  <!-- North Ray (Highlight) -->
  <polygon points="32,10 36,29 32,26.5" fill="#FFF2CE"/>
  <polygon points="32,10 28,29 32,26.5" fill="#D8A24A"/>
  
  <!-- South Ray -->
  <polygon points="32,54 36,35 32,37.5" fill="#C59B3F"/>
  <polygon points="32,54 28,35 32,37.5" fill="#8C661D"/>
  
  <!-- East Ray -->
  <polygon points="54,32 35,36 37.5,32" fill="#D8A24A"/>
  <polygon points="54,32 35,28 37.5,32" fill="#FFF2CE"/>
  
  <!-- West Ray -->
  <polygon points="10,32 29,36 26.5,32" fill="#8C661D"/>
  <polygon points="10,32 29,28 26.5,32" fill="#C59B3F"/>

  <!-- Secondary Diagonal Rays -->
  <polygon points="47,17 34,29 33,26" fill="#D8A24A" opacity="0.9"/>
  <polygon points="17,47 30,35 31,38" fill="#8C661D" opacity="0.9"/>
  <polygon points="17,17 29,30 26,29" fill="#D8A24A" opacity="0.9"/>
  <polygon points="47,47 35,34 38,35" fill="#8C661D" opacity="0.9"/>

  <!-- Center Celestial/Navigational Core -->
  <circle cx="32" cy="32" r="5.5" fill="#173B4D" stroke="#FFF2CE" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="2.2" fill="#D8A24A"/>
</svg>
